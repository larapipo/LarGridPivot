name: Apply smooth scroll patch
on:
  push:
    branches: [fix-smooth-scroll]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[smooth-scroll-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-smooth-scroll
      - run: python apply_smooth_scroll.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Smooth pivot scrolling and reduce repaint flicker [smooth-scroll-applied]"
          git push origin HEAD:fix-smooth-scroll
