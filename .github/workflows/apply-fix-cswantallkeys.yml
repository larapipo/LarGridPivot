name: Apply csWantAllKeys fix
on:
  push:
    branches: [fix-remove-cswantallkeys]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[cswant-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-remove-cswantallkeys
      - name: Apply patch
        run: python apply_fix_cswantallkeys.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Fix unsupported csWantAllKeys control style [cswant-fix-applied]"
          git push origin HEAD:fix-remove-cswantallkeys
