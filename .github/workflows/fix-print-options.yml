name: Fix print options integration
on:
  push:
    branches: [feature-print-page-setup]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[print-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-print-page-setup
      - run: python fix_print_options.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Fix print options integration [print-fix-applied]"
          git push origin HEAD:feature-print-page-setup
