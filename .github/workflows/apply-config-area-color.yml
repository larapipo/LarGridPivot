name: Apply config area color
on:
  push:
    branches: [feature-config-area-color-final]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[config-color-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-config-area-color-final
      - run: python apply_config_area_color.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Add configurable pastel field-area background [config-color-applied]"
          git push origin HEAD:feature-config-area-color-final
