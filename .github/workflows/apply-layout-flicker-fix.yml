name: Apply layout and flicker fix
on:
  push:
    branches: [fix-layout-gap-selection-flicker]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[layout-flicker-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-layout-gap-selection-flicker
      - run: python apply_layout_flicker_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Fix totals layout gap and selection flicker [layout-flicker-applied]"
          git push origin HEAD:fix-layout-gap-selection-flicker
