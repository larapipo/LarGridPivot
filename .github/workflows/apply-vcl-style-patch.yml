name: Apply VCL style patch
on:
  push:
    branches: [fix-vcl-style-colors]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vcl-style-colors
      - name: Patch Grid colors
        shell: python
        run: |
          from pathlib import Path
          p=Path('Source/LarGridPivot.Grid.pas')
          s=p.read_text(encoding='utf-8')
          old="  Canvas.Brush.Color:=FConfigAreaColor; Canvas.FillRect(AR); Canvas.Pen.Color:=ThemeGridColor; Canvas.Rectangle(AR);"
          new="  if FTheme=ptVclStyle then Canvas.Brush.Color:=ThemePanelColor else Canvas.Brush.Color:=FConfigAreaColor;\n  Canvas.FillRect(AR); Canvas.Pen.Color:=ThemeGridColor; Canvas.Rectangle(AR);"
          if old not in s:
              raise SystemExit('Expected DrawFieldAreas background line not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-vcl-style-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas .github/workflows/apply-vcl-style-patch.yml
          git commit -m "Respect active VCL style in field configuration area"
          git push origin HEAD:fix-vcl-style-colors
