name: Cleanup print preview
on:
  push:
    paths: [trigger-cleanup-preview.txt]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-print-preview
      - run: python cleanup_print_preview.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Clean print preview implementation [preview-applied]"
          git push origin HEAD:feature-print-preview
