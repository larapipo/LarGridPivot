name: Apply selection fix
on:
  push:
    branches: [fix-row-selection-no-flicker]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[selection-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-row-selection-no-flicker
      - run: python apply_selection_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Fix row selection coordinates and reduce flicker [selection-fix-applied]"
          git push origin HEAD:fix-row-selection-no-flicker
