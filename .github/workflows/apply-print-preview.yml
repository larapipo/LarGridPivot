name: Apply print preview
on:
  push:
    branches: [feature-print-preview]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[preview-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-print-preview
      - run: python apply_print_preview.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Add native print preview [preview-applied]"
          git push origin HEAD:feature-print-preview
