name: Run print renderer migration
on:
  push:
    branches:
      - fix-print-hierarchy-pagination
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-print-hierarchy-pagination
          fetch-depth: 0
      - name: Extract and run migration
        run: |
          sed -n '/^          import re$/,/^          p.write_text/p' .github/workflows/apply-print-fix.yml | sed 's/^          //' > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/LarGridPivot.Grid.pas
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(print): preserve hierarchy and paginate columns"
          git push origin HEAD:fix-print-hierarchy-pagination
