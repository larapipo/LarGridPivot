name: Apply VCL style field area fix
on:
  push:
    branches: [fix-vcl-style-field-area]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-vcl-style-field-area
      - name: Patch field area colors
        shell: python
        run: |
          from pathlib import Path
          p = Path('Source/LarGridPivot.Grid.pas')
          s = p.read_text(encoding='utf-8')
          old = "if FTheme=ptVclStyle then Canvas.Brush.Color:=ThemePanelColor else Canvas.Brush.Color:=FConfigAreaColor;"
          new = "if FTheme=ptVclStyle then Canvas.Brush.Color:=ThemeHeaderColor else Canvas.Brush.Color:=FConfigAreaColor;"
          if old not in s:
              raise SystemExit('Expected DrawFieldAreas line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-vcl-style-field-area.yml
          git add Source/LarGridPivot.Grid.pas
          git commit -m "Use VCL header colors in field configuration area"
          git push origin HEAD:fix-vcl-style-field-area
